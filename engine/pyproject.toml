[project]
name = "contextrail"
version = "0.2.0"
description = "ContextRail engine: business process automation, powered by AI — governed by written policy, verified by read-back."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "anthropic[bedrock]==1.8.0",
    "boto3==1.43.103",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "mcp==2.2.0",
    "opentelemetry-sdk==1.45.0",
    "psycopg[binary,pool]==3.3.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
    "slack-bolt==1.30.0",
    "structlog==26.1.0",
    "tenacity==9.1.4",
    "uvicorn[standard]==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contextrail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[dependency-groups]
dev = [
    "pgserver==0.1.4",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.9",
]
