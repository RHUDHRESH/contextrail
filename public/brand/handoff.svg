<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" role="img" aria-labelledby="t d">
  <title id="t">The capsule hops. Nothing is re-derived.</title>
  <desc id="d">HR, IT, and Security each receive the same capsule by value, including the terminal deny.</desc>
  <rect width="1200" height="220" fill="#07090e"/>
  <line x1="80" y1="110" x2="1120" y2="110" stroke="#2b3548" stroke-width="2"/>
  <polygon points="1118,110 1098,102 1098,118" fill="#6e8cff"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="70" y="70" width="200" height="80" rx="10" fill="#0d111a" stroke="#1c2434"/>
    <text x="170" y="102" text-anchor="middle" fill="#6e8cff" font-family="ui-monospace, Menlo, monospace" font-size="11">HR AGENT</text>
    <text x="170" y="122" text-anchor="middle" fill="#e9edf6" font-size="13">opens ticket</text>

    <rect x="500" y="70" width="200" height="80" rx="10" fill="#0d111a" stroke="#1c2434"/>
    <text x="600" y="102" text-anchor="middle" fill="#6e8cff" font-family="ui-monospace, Menlo, monospace" font-size="11">IT AGENT</text>
    <text x="600" y="122" text-anchor="middle" fill="#e9edf6" font-size="13">Okta · laptop · Slack</text>

    <rect x="930" y="70" width="200" height="80" rx="10" fill="#0d111a" stroke="#1c2434"/>
    <text x="1030" y="102" text-anchor="middle" fill="#6e8cff" font-family="ui-monospace, Menlo, monospace" font-size="11">SECURITY</text>
    <text x="1030" y="122" text-anchor="middle" fill="#e9edf6" font-size="13">holds GitHub · stops prod</text>
  </g>

  <!-- flying capsule copies -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#e9edf6">
    <rect x="300" y="40" width="130" height="36" rx="18" fill="#121826" stroke="#6e8cff"/>
    <text x="365" y="62" text-anchor="middle">capsule ’</text>
    <rect x="730" y="40" width="170" height="36" rx="18" fill="#121826" stroke="#6e8cff"/>
    <text x="815" y="62" text-anchor="middle">+ POL-CTR-001</text>
  </g>

  <text x="80" y="196" fill="#8b95aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Same object at every hop. The deny is not summarised away. Security does not re-ask HRIS who Priya is.</text>
</svg>
