<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="t d">
  <title id="t">ContextRail  one request on the eight-stage rail</title>
  <desc id="d">A contractor onboarding request travels eight stages. Seven actions clear. GitHub is held. Production credentials stop.</desc>
  <rect width="1200" height="280" fill="#07090e"/>
  <text x="40" y="36" fill="#5a6377" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">CTX-24081 · CONTRACTOR ONBOARDING · PRIYA IYER</text>
  <text x="40" y="62" fill="#e9edf6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Give her everything. The rail does not.</text>

  <!-- double track -->
  <line x1="40" y1="148" x2="1160" y2="148" stroke="#2b3548" stroke-width="3"/>
  <line x1="40" y1="158" x2="1160" y2="158" stroke="#2b3548" stroke-width="3"/>
  <line x1="40" y1="148" x2="1160" y2="148" stroke="#6e8cff" stroke-width="1.5" stroke-dasharray="10 8" opacity="0.55"/>

  <!-- capsule -->
  <rect x="488" y="118" width="224" height="72" rx="36" fill="#121826" stroke="#6e8cff" stroke-width="2"/>
  <circle cx="524" cy="154" r="8" fill="#3ddc97"/>
  <text x="544" y="148" fill="#e9edf6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">CAPSULE</text>
  <text x="544" y="166" fill="#8b95aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">subject · citations · POL-CTR-001</text>

  <!-- lamps -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle">
    <circle cx="80" cy="153" r="9" fill="#3ddc97"/><text x="80" y="196" fill="#8b95aa">DISCOVER</text>
    <circle cx="210" cy="153" r="9" fill="#3ddc97"/><text x="210" y="196" fill="#8b95aa">COMPILE</text>
    <circle cx="340" cy="153" r="9" fill="#3ddc97"/><text x="340" y="196" fill="#8b95aa">GOVERN</text>
    <circle cx="600" cy="98" r="9" fill="#6e8cff"/><text x="600" y="88" fill="#6e8cff">PLAN</text>
    <circle cx="860" cy="153" r="9" fill="#3ddc97"/><text x="860" y="196" fill="#8b95aa">HANDOFF</text>
    <circle cx="980" cy="153" r="9" fill="#f5a623"/><text x="980" y="196" fill="#f5a623">APPROVE</text>
    <circle cx="1090" cy="153" r="9" fill="#3ddc97"/><text x="1090" y="196" fill="#8b95aa">EXECUTE</text>
    <circle cx="1160" cy="153" r="6" fill="#ff5a5f"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">
    <rect x="40" y="226" width="10" height="10" rx="5" fill="#3ddc97"/>
    <text x="58" y="236" fill="#8b95aa">7 verified</text>
    <rect x="160" y="226" width="10" height="10" rx="5" fill="#f5a623"/>
    <text x="178" y="236" fill="#8b95aa">1 held for Security</text>
    <rect x="340" y="226" width="10" height="10" rx="5" fill="#ff5a5f"/>
    <text x="358" y="236" fill="#8b95aa">production credentials refused  terminal</text>
  </g>
</svg>
